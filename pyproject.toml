[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "attempt-of-meshing-agent"
version = "0.10.14"
description = "An exploration of LLM-guided automotive meshing with OpenFOAM"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
dependencies = [
  "numpy>=2.0,<3", "scipy>=1.14,<2", "trimesh>=4.5,<5", "rtree>=1.3,<2",
  "vtk>=9.3,<10", "embreex>=2.17,<5", "matplotlib>=3.9,<4", "Pillow>=11,<13"
]

[project.urls]
Repository = "https://github.com/mystic-qaq/Attempt_of_Meshing_Agent"

[project.scripts]
cfdmesh = "cfdmesh.cli:main"

[tool.setuptools.packages.find]
include = ["cfdmesh*"]
